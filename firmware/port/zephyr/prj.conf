CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_PWM=y
CONFIG_GPIO=y

# Bluetooth: one phone or gateway connects and exchanges text lines over the Nordic UART Service.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="PulsePatch"
CONFIG_BT_NUS=y

# The board has no 32 kHz crystal; use the internal RC oscillator.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
