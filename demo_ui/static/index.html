<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amethyst Live Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FFFFFF; --soft: #F7F7F8; --line: #EAEAEE;
  --ink: #0A0A0B; --muted: #5B5B66; --faint: #9A9AA6;
  --brand: #6B3FA0; --brand-deep: #4E2B7C;
  --normal: #1F7A5A; --warning: #B45309; --infection: #C2253D; --fault: #5B5B66;
  --z-normal: #D3EBDF; --z-warning: #F6E2C4; --z-infection: #F4CDD3;
  --sans: "Inter", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
.label { font-size: 12px; font-weight: 500; color: var(--muted); }
.mono { font-family: var(--mono); }

.app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
header { display: flex; align-items: center; gap: 20px; padding: 0 32px; height: 56px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 16px; letter-spacing: -.01em; }
.brand svg { width: 18px; height: 18px; }
header .spacer { flex: 1; }
.hbtn { border: 0; background: none; padding: 6px 0; cursor: pointer; font-size: 13px; color: var(--muted); }
.hbtn:hover { color: var(--ink); }
.hbtn b { font-weight: 500; color: var(--ink); }

.split { display: grid; grid-template-columns: 420px 1fr; min-height: 0; }
.left { border-right: 1px solid var(--line); padding: 28px 32px; overflow-y: auto; }
.right { padding: 28px 40px; overflow-y: auto; min-width: 0; }
h2 { font-size: 15px; font-weight: 600; margin: 0 0 14px; }

.seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { flex: 1; border: 0; border-right: 1px solid var(--line); background: var(--bg); padding: 7px 4px; font-size: 12.5px; cursor: pointer; color: var(--muted); white-space: nowrap; }
.seg button:last-child { border-right: 0; }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--soft); color: var(--ink); font-weight: 500; }
.scen { flex-wrap: wrap; }
.scen button { flex: 1 1 33%; border-bottom: 1px solid var(--line); }

.rows { margin-top: 22px; }
.row { display: grid; grid-template-columns: 1fr 104px; gap: 4px 16px; padding: 12px 0; border-top: 1px solid var(--line); }
.row:last-child { border-bottom: 1px solid var(--line); }
.row .nm { font-weight: 500; }
.row .base { font-size: 12px; color: var(--faint); }
.inp { grid-row: 1 / span 2; grid-column: 2; display: flex; align-items: baseline; justify-content: flex-end; gap: 5px; border-bottom: 1px solid var(--line); align-self: center; padding: 2px 0; }
.inp:focus-within { border-color: var(--ink); }
.inp.bad { border-color: var(--infection); }
.inp input { width: 64px; border: 0; outline: 0; text-align: right; font: 500 16px var(--mono); background: transparent; -moz-appearance: textfield; }
.inp input::-webkit-outer-spin-button, .inp input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.inp span { font-size: 11.5px; color: var(--faint); width: 34px; }
.bar { grid-column: 1; position: relative; height: 6px; display: flex; margin-top: 6px; }
.bar i { height: 100%; } .bar i:first-child { border-radius: 3px 0 0 3px; } .bar i:last-child { border-radius: 0 3px 3px 0; }
.bar .mk { position: absolute; top: -4px; width: 2px; height: 14px; margin-left: -1px; background: var(--ink); transition: left .25s ease; }
.bar .bl { position: absolute; top: -2px; width: 1px; height: 10px; background: var(--muted); opacity: .5; }
.legend { display: flex; gap: 14px; margin-top: 12px; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 6px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; background: var(--c); }

.time { margin-top: 22px; display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.send { margin-top: 16px; width: 100%; border: 0; border-radius: 6px; background: var(--ink); color: #fff; padding: 12px; font-weight: 500; cursor: pointer; }
.send:hover { background: #26262B; }
.send:disabled { background: var(--faint); cursor: progress; }
.err { color: var(--infection); font-size: 12.5px; min-height: 18px; margin-top: 8px; }

.pipe { display: grid; grid-template-columns: 1fr 24px 1fr 24px 1fr 24px 1fr; align-items: start; }
.step { padding-top: 10px; border-top: 2px solid var(--line); transition: border-color .25s; min-width: 0; }
.step .nm { font-weight: 600; }
.step .sb { font-size: 12px; color: var(--faint); }
.step .st { font: 12px var(--mono); color: var(--muted); margin-top: 6px; min-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step.active { border-top-color: var(--brand); }
.step.active .st { color: var(--brand-deep); }
.step.done { border-top-color: var(--ink); }
.step.warn { border-top-color: var(--warning); }
.arrow { text-align: center; color: var(--faint); padding-top: 14px; font-size: 13px; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; margin-top: 36px; border-top: 1px solid var(--line); }
.grid2 > div { padding: 22px 0 0; min-width: 0; }
.grid2 > div:first-child { padding-right: 32px; border-right: 1px solid var(--line); }
.grid2 > div:last-child { padding-left: 32px; }
.risk { display: flex; align-items: baseline; gap: 14px; margin-top: 6px; }
.risk .n { font-size: 56px; font-weight: 600; letter-spacing: -.04em; line-height: 1; }
.risk .of { color: var(--faint); font-size: 15px; margin-left: -8px; }
.lvl { font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.lvl::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.l-normal { color: var(--normal); } .l-warning { color: var(--warning); } .l-infection { color: var(--infection); } .l-fault, .l-idle { color: var(--fault); }
.tier { color: var(--muted); font-size: 13px; margin-top: 4px; }
#chart { width: 100%; height: 110px; display: block; margin-top: 18px; }
.therapy { margin-top: 16px; font-size: 13px; color: var(--muted); }
.therapy b { color: var(--ink); font-weight: 500; }
.say { font-size: 16px; line-height: 1.5; margin: 6px 0 0; }
.say.idle { color: var(--faint); }
.say a { color: var(--brand); text-decoration: none; font-size: 13px; }
.meta { font-size: 12.5px; color: var(--muted); margin-top: 10px; }
.meta .w { color: var(--warning); }
.drv { margin-top: 20px; }
.drv .r { display: grid; grid-template-columns: 110px 1fr; gap: 12px; align-items: center; font-size: 12.5px; color: var(--muted); padding: 3px 0; }
.drv .t { position: relative; height: 6px; background: var(--soft); border-radius: 3px; }
.drv .t b { position: absolute; top: 0; height: 100%; border-radius: 3px; transition: all .4s ease; }
.drv .t::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line); }
.drv .ax { display: flex; justify-content: space-between; margin-left: 122px; font-size: 11px; color: var(--faint); margin-top: 4px; }

.log { margin-top: 36px; border-top: 1px solid var(--line); padding-top: 18px; }
.log ol { list-style: none; margin: 10px 0 0; padding: 0; font: 12px/1.7 var(--mono); color: var(--muted); max-height: 190px; overflow-y: auto; }
.log li { display: grid; grid-template-columns: 48px 70px 1fr; gap: 8px; animation: in .25s ease both; }
.log li .t { color: var(--faint); text-align: right; }
.log li .s { color: var(--faint); }
.log li .x { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log li .x span { color: var(--faint); margin-left: 8px; }
.log li.w .x { color: var(--warning); }
.log li.gap { display: block; height: 1px; background: var(--line); margin: 6px 0; }
@keyframes in { from { opacity: 0; } to { opacity: 1; } }
.thinking::after { content: "…"; animation: dots 1.2s steps(4) infinite; display: inline-block; width: 1.2em; overflow: hidden; vertical-align: bottom; }
@keyframes dots { from { width: 0; } to { width: 1.2em; } }

@media (max-width: 1100px) { .split { grid-template-columns: 1fr; } .left { border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Amethyst
      <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M29 4 L7 33 L25 40 Z" fill="#4E2B7C"/><path d="M29 4 L25 40 L52 35 Z" fill="#B79BE0"/><path d="M29 4 L52 35 L58 28 Z" fill="#6B3FA0"/><path d="M7 33 L25 40 L23 57 L14 54 L9 47 Z" fill="#6B3FA0"/><path d="M25 40 L52 35 L50 50 L43 56 L35 54 L29 59 L23 57 Z" fill="#8E66CC"/><path d="M52 35 L58 28 L58 41 L55 48 L50 50 Z" fill="#4E2B7C"/></svg>
    </div>
    <span class="label">Live demo</span>
    <div class="spacer"></div>
    <button class="hbtn" id="agentBtn">Agent: <b id="agentName">offline</b></button>
    <span class="hbtn mono" id="clock" style="cursor:default">hour 24</span>
    <button class="hbtn" id="resetBtn">New patient</button>
  </header>

  <div class="split">
    <section class="left">
      <h2>Patch reading</h2>
      <div class="seg scen" id="scen"></div>
      <div class="rows" id="rows"></div>
      <div class="legend">
        <span style="--c:var(--z-normal)">Normal</span><span style="--c:var(--z-warning)">Warning</span><span style="--c:var(--z-infection)">Infection</span>
      </div>
      <div class="time"><span class="label">Hold for</span><div class="seg" id="hold"></div></div>
      <button class="send" id="send">Send</button>
      <div class="err" id="err"></div>
    </section>

    <section class="right">
      <div class="pipe">
        <div class="step" id="p-hardware"><div class="nm">Patch</div><div class="sb">sensors</div><div class="st" id="s-hardware"></div></div>
        <div class="arrow">→</div>
        <div class="step" id="p-agent"><div class="nm">Agent</div><div class="sb" id="agentSub">offline</div><div class="st" id="s-agent"></div></div>
        <div class="arrow">⇄</div>
        <div class="step" id="p-ml"><div class="nm">Model</div><div class="sb">XGBoost</div><div class="st" id="s-ml"></div></div>
        <div class="arrow">→</div>
        <div class="step" id="p-mobile"><div class="nm">App</div><div class="sb">Expo Go</div><div class="st" id="s-mobile"></div></div>
      </div>

      <div class="grid2">
        <div>
          <div class="label">Infection risk</div>
          <div class="risk"><span class="n" id="riskN">–</span><span class="of">/100</span><span class="lvl l-idle" id="lvl">Baseline</span></div>
          <div class="tier" id="tier">First 24 h set this patient's baseline</div>
          <svg id="chart" viewBox="0 0 400 110" preserveAspectRatio="none"></svg>
          <div class="therapy" id="therapy">Therapy: <b>none</b></div>
        </div>
        <div>
          <div class="label" id="agentLabel">Assessment</div>
          <p class="say idle" id="say">Send a reading.</p>
          <div class="meta" id="meta"></div>
          <div class="drv"><div id="drv"></div><div class="ax"><span>normal</span><span>infection</span></div></div>
        </div>
      </div>

      <div class="log"><div class="label">Log</div><ol id="log"></ol></div>
    </section>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const ORDER = ["ph", "temp_c", "impedance_kohm", "blood_glucose_mgdl", "wound_glucose_mM"];
const ZC = { normal: "var(--z-normal)", warning: "var(--z-warning)", infection: "var(--z-infection)" };
const WORD = { normal: "Normal", warning: "Warning", infection: "Infection", fault: "Check patch", idle: "Baseline" };
const HOLD = [0.5, 2, 4, 6, 12, 24];
const DP = { ph: 2, temp_c: 1, impedance_kohm: 1, blood_glucose_mgdl: 0, wound_glucose_mM: 2 };
let CFG, P, hold = 6, useAgent = false, busy = false, series = [];

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function init() {
  CFG = await (await fetch("/api/config")).json();
  useAgent = CFG.llm_available;
  setPatient(CFG);
  $("#hold").innerHTML = HOLD.map((h) => `<button data-h="${h}">${h < 1 ? "30 min" : h + " h"}</button>`).join("");
  $("#hold").onclick = (e) => { if (e.target.dataset.h) setHold(+e.target.dataset.h); };
  setHold(hold);
  $("#send").onclick = send;
  $("#resetBtn").onclick = reset;
  $("#agentBtn").onclick = () => { if (CFG.llm_available) { useAgent = !useAgent; agentLabel(); } };
  agentLabel();
}
function setHold(h) { hold = h; [...$("#hold").children].forEach((b) => b.classList.toggle("on", +b.dataset.h === h)); }
function agentLabel() {
  const live = useAgent && CFG.llm_available;
  $("#agentName").textContent = live ? "Claude Opus" : "offline";
  $("#agentSub").textContent = live ? "Claude Opus" : "offline rules";
  $("#agentBtn").title = CFG.llm_available ? "Switch agent" : "Add ANTHROPIC_API_KEY to .env";
}

// zones and presets come from the server: same thresholds the model and agent use
function setPatient(c) {
  P = c;
  $("#scen").innerHTML = Object.keys(c.presets).map((k) => `<button data-p="${k}">${k}</button>`).join("");
  $("#scen").onclick = (e) => { const k = e.target.dataset.p; if (!k) return; fill(c.presets[k].values); setHold(c.presets[k].hours); scenOn(k); };
  $("#rows").innerHTML = ORDER.map((k) => {
    const r = CFG.ranges[k], z = c.zones[k], span = z.hi - z.lo;
    const bands = z.bands.map(([a, b, lvl]) => `<i style="flex:${b - a};background:${ZC[lvl]}"></i>`).join("");
    const bl = ((c.baseline[k] - z.lo) / span) * 100;
    return `<div class="row">
      <div><div class="nm">${r.label}</div><div class="base">baseline ${c.baseline[k].toFixed(DP[k])}</div></div>
      <label class="inp" id="i-${k}"><input id="f-${k}" type="number" step="any" inputmode="decimal"><span>${r.unit}</span></label>
      <div class="bar">${bands}<span class="bl" style="left:${bl}%"></span><span class="mk" id="m-${k}"></span></div>
    </div>`;
  }).join("");
  ORDER.forEach((k) => $(`#f-${k}`).addEventListener("input", () => { mark(k); scenOn(null); }));
  fill(c.presets.Healthy.values); setHold(6); scenOn(null);
}
function scenOn(k) { [...$("#scen").children].forEach((b) => b.classList.toggle("on", b.dataset.p === k)); }
function fill(v) { ORDER.forEach((k) => { $(`#f-${k}`).value = +(+v[k]).toFixed(DP[k]); mark(k); }); }
function mark(k) {
  const v = parseFloat($(`#f-${k}`).value), z = P.zones[k], r = CFG.ranges[k];
  const pct = Math.max(0, Math.min(100, ((v - z.lo) / (z.hi - z.lo)) * 100));
  $(`#m-${k}`).style.left = `${isNaN(pct) ? 0 : pct}%`;
  $(`#i-${k}`).classList.toggle("bad", isNaN(v) || v < r.min || v > r.max);
}

async function reset() {
  if (busy) return;
  const c = await (await fetch("/api/reset", { method: "POST" })).json();
  setPatient(c); series = []; chart(); $("#log").innerHTML = ""; $("#clock").textContent = "hour 24";
  setLevel("idle"); $("#riskN").textContent = "–"; $("#tier").textContent = "First 24 h set this patient's baseline";
  $("#therapy").innerHTML = "Therapy: <b>none</b>"; $("#say").textContent = "Send a reading."; $("#say").className = "say idle";
  $("#meta").innerHTML = ""; $("#agentLabel").textContent = "Assessment"; drivers([]);
  ["hardware", "agent", "ml", "mobile"].forEach((n) => { step(n, ""); $(`#s-${n}`).textContent = ""; });
}

const NODE = { hardware: "hardware", agent: "agent", ml: "ml", therapy: "ml", mobile: "mobile", error: "hardware" };
function step(n, cls) { const el = $(`#p-${n}`); el.classList.remove("active", "done", "warn"); if (cls) el.classList.add(cls); }
let queue = [], draining = false, thinking = null;

function log(ev) {
  if (thinking) { thinking.remove(); thinking = null; }
  const li = document.createElement("li");
  if (ev.status === "warn" || ev.status === "error") li.className = "w";
  li.innerHTML = `<span class="t">${ev.t.toFixed(1)}s</span><span class="s">${ev.stage}</span><span class="x">${esc(ev.title)}${ev.detail ? `<span>${esc(ev.detail)}</span>` : ""}</span>`;
  $("#log").appendChild(li);
  if (ev.title === "Opus reasoning") {
    thinking = document.createElement("li");
    thinking.innerHTML = `<span class="t"></span><span class="s">agent</span><span class="x thinking" style="color:var(--brand-deep)">thinking</span>`;
    $("#log").appendChild(thinking);
  }
  $("#log").scrollTop = $("#log").scrollHeight;
}
async function drain() {
  if (draining) return; draining = true;
  while (queue.length) {
    const ev = queue.shift(), n = NODE[ev.stage];
    step(n, ev.status === "active" ? "active" : ev.status === "warn" || ev.status === "error" ? "warn" : "done");
    $(`#s-${n}`).textContent = status(ev);
    log(ev); handle(ev);
    await sleep(ev.stage === "mobile" ? 120 : 550);
  }
  draining = false;
}
function status(ev) {
  if (ev.data?.prediction) return `risk ${Math.round(ev.data.prediction.risk_score)}`;
  if (ev.stage === "mobile") return ev.detail.toLowerCase();
  if (ev.stage === "hardware") return ev.status === "done" ? ev.title : "receiving";
  if (ev.stage === "therapy") return ev.status === "done" ? "plan ready" : "planning";
  if (ev.status === "warn") return "offline fallback";
  return ev.status === "active" ? "working" : "done";
}

function setLevel(lvl) { const el = $("#lvl"); el.className = `lvl l-${lvl}`; el.textContent = WORD[lvl]; }
function handle(ev) {
  const d = ev.data || {};
  if (d.prediction) {
    const p = d.prediction;
    $("#riskN").textContent = Math.round(p.risk_score);
    setLevel(d.level);
    $("#tier").textContent = `${p.tier.split(" ").slice(1).join(" ")} tier · p = ${p.p_infected.toFixed(2)}`;
  }
  if (d.drivers) drivers(d.drivers);
  if (d.notes) notes(d.notes, d.source);
  if (d.plan) $("#therapy").innerHTML = `Therapy: <b>${esc(therapy(d.plan))}</b>`;
  if (d.state) {
    series = d.state.risk_series; chart();
    setLevel(d.state.level);
    $("#clock").textContent = `hour ${d.state.hours.toFixed(1).replace(/\.0$/, "")}`;
  }
}
function therapy(p) {
  if (p.skipped_reason) return "paused, patch off skin";
  const a = [];
  if (p.us_40khz_min) a.push(`40 kHz ultrasound ${p.us_40khz_min} min`);
  if (p.led_405nm_min) a.push(`405 nm LED ${p.led_405nm_min} min`);
  if (p.us_1p5mhz_min) a.push(`1.5 MHz healing ultrasound ${p.us_1p5mhz_min} min`);
  return a.join(", then ") || "none";
}
function notes(n, source) {
  $("#agentLabel").textContent = source === "opus" ? "Assessment · Claude Opus" : "Assessment · offline rules";
  const full = String(n.summary || ""), first = (full.match(/^.*?[.!?](\s|$)/) || [full])[0].trim();
  $("#say").className = "say";
  if (first.length < full.length) {
    $("#say").innerHTML = `${esc(first)} <a href="#" id="more">more</a>`;
    $("#more").onclick = (e) => { e.preventDefault(); $("#say").textContent = full; };
  } else $("#say").textContent = full;
  const m = [`Confidence ${esc(n.confidence)}`];
  if (n.recommend_clinician_review) m.push(`<span class="w">Clinician review</span>`);
  const fl = n.data_quality_flags || [];
  if (fl.length) m.push(`<span class="w" title="${esc(fl.join("\n\n"))}" style="cursor:help;border-bottom:1px dotted">${fl.length} data issue${fl.length > 1 ? "s" : ""}</span>`);
  $("#meta").innerHTML = m.join(" · ");
}
function drivers(ds) {
  const names = ["pH", "Temperature", "Moisture", "Wound glucose", "Blood glucose"];
  const v = Object.fromEntries(ds.map((d) => [d.sensor, d.contribution]));
  const max = Math.max(1, ...names.map((n) => Math.abs(v[n] || 0)));
  $("#drv").innerHTML = names.map((n) => {
    const x = v[n] || 0, w = (Math.abs(x) / max) * 50;
    const s = x > 0 ? `left:50%;width:${w}%;background:var(--ink)` : `left:${50 - w}%;width:${w}%;background:#C9C9D1`;
    return `<div class="r"><span>${n}</span><div class="t"><b style="${s}"></b></div></div>`;
  }).join("");
}
function chart() {
  const W = 400, H = 110, svg = $("#chart"), x0 = 24, x1 = Math.max(48, ...series.map((p) => p.hour));
  const X = (h) => ((h - x0) / (x1 - x0)) * W, Y = (r) => 4 + (1 - r / 100) * (H - 8);
  let g = `<rect x="0" y="${Y(100)}" width="${W}" height="${Y(55) - Y(100)}" fill="#FBF1F2"/>`
        + `<rect x="0" y="${Y(55)}" width="${W}" height="${Y(30) - Y(55)}" fill="#FDF7EE"/>`
        + `<line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="#EAEAEE" vector-effect="non-scaling-stroke"/>`;
  if (series.length) {
    const d = series.map((p, i) => `${i ? "L" : "M"}${X(p.hour).toFixed(1)},${Y(p.risk_score).toFixed(1)}`).join(" ");
    g += `<path d="${d}" fill="none" stroke="#0A0A0B" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
  }
  svg.innerHTML = g;
}

async function send() {
  if (busy) return;
  const body = { advance_hours: hold, use_agent: useAgent };
  for (const k of ORDER) {
    const v = parseFloat($(`#f-${k}`).value), r = CFG.ranges[k];
    if (isNaN(v) || v < r.min || v > r.max) { $("#err").textContent = `${r.label} must be ${r.min}–${r.max} ${r.unit}`; return; }
    body[k] = v;
  }
  $("#err").textContent = ""; busy = true; $("#send").disabled = true; $("#send").textContent = "Running…";
  ["hardware", "agent", "ml", "mobile"].forEach((n) => step(n, ""));
  if ($("#log").children.length) { const g = document.createElement("li"); g.className = "gap"; $("#log").appendChild(g); }
  try {
    const res = await fetch("/api/reading", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const rd = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await rd.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf("\n")) >= 0) { const line = buf.slice(0, i); buf = buf.slice(i + 1); if (line.trim()) { queue.push(JSON.parse(line)); drain(); } }
    }
    while (draining || queue.length) await sleep(100);
  } catch (e) { $("#err").textContent = "Server error: " + e.message; }
  busy = false; $("#send").disabled = false; $("#send").textContent = "Send";
}
init(); chart(); drivers([]);
</script>
